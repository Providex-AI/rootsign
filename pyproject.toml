[project]
name = "rootsign"
version = "0.2.1"
description = "RootSign — tamper-evident provenance logging for AI agents (powered by Providex AI)"
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [{ name = "Providex AI Inc." }]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
# Core install is dependency-light and DB-free (ADR-011): `pip install rootsign`
# defaults to the JSONL backend and pulls no database driver. The Postgres/
# Timescale stack lives in the `postgres` extra below.
dependencies = [
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "typer>=0.12,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
# The DB stack (ADR-011). Required only for ROOTSIGN_BACKEND=postgres and the
# admin/migration tooling. Not needed for the default JSONL backend.
postgres = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "psycopg2-binary>=2.9,<3.0",
    "greenlet>=3.0,<4.0",
]
test = [
    "rootsign[postgres]",
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "pytest-cov>=5.0,<7.0",
    "anyio[trio]>=4.0,<5.0",
    "httpx>=0.27,<1.0",
]
dev = [
    "rootsign[postgres]",
    "ruff>=0.5,<1.0",
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "pytest-cov>=5.0,<7.0",
    "anyio[trio]>=4.0,<5.0",
    "httpx>=0.27,<1.0",
]
langgraph = ["langgraph>=0.1"]
crewai = ["crewai>=0.28"]
autogen = ["pyautogen>=0.2"]
# MCP interception (ADR-010). Optional — the core SDK imports with zero MCP
# deps; rootsign/mcp/* imports these lazily inside functions.
mcp = [
    # Cap below 2.0: mcp 2.0 is a major rewrite that relocated FastMCP out of
    # `mcp.server.fastmcp` (and pulls an httpx2/mcp-types ecosystem). The audit
    # server (rootsign/mcp/server.py) is built against the 1.x FastMCP API
    # (streamable_http_app, @mcp.tool). Revisit when porting to 2.x.
    "mcp>=1.9,<2.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.scripts]
rootsign = "rootsign.sdk.cli:app"
rootsign-admin = "rootsign.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rootsign"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "benchmark: performance benchmark tests (require running Postgres+TimescaleDB)",
    "integration: integration tests requiring a running database",
]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.coverage.run]
branch = true
source = ["rootsign"]
# rootsign/cli.py — admin CLI is exercised only by integration scripts.
omit = ["rootsign/cli.py"]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
# Point basedpyright / pyright at the uv-managed virtualenv so it can resolve
# pytest, sqlalchemy, etc. Both basedpyright (used by Cursor/VS Code) and
# upstream pyright honor this section.
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
include = ["rootsign", "tests", "scripts"]
exclude = [".venv", "rootsign/_migrations/versions"]
reportMissingImports = "warning"
reportUnusedImport = "warning"
