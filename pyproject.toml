[project]
name = "providex-core"
version = "0.1.0"
description = "Providex AI — canonical data model and storage layer (Phase 0)"
readme = "AGENTS.md"
requires-python = ">=3.11,<3.15"
authors = [{ name = "Providex AI" }]
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "psycopg2-binary>=2.9,<3.0",
    "greenlet>=3.0,<4.0",
    "typer>=0.12,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<7.0",
    "anyio>=4.0,<5.0",
]
dev = [
    "ruff>=0.5,<1.0",
]

[project.scripts]
providex-core = "providex.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["providex"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "benchmark: performance benchmark tests (require running Postgres+TimescaleDB)",
    "integration: integration tests requiring a running database",
]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.coverage.run]
branch = true
source = ["providex"]
omit = ["providex/cli.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
