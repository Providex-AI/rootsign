[project]
name = "rootsign-example-langgraph-invoice-agent"
version = "0.0.0"
description = "Minimal runnable LangGraph + RootSign invoice agent"
requires-python = ">=3.11,<3.13"
dependencies = [
    "rootsign[langgraph]>=0.1.1",
    "langchain-openai>=0.2.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
