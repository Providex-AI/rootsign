services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: rootsign-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: rootsign
      POSTGRES_PASSWORD: rootsign
      POSTGRES_DB: rootsign_dev
    ports:
      - "5432:5432"
    volumes:
      - rootsign_pgdata:/var/lib/postgresql/data
      - ./scripts/init_test_db.sql:/docker-entrypoint-initdb.d/01_init_test_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rootsign -d rootsign_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rootsign_pgdata:
