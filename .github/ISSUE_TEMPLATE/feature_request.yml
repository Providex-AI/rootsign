name: Feature request
description: Suggest a new capability or improvement
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the limitation or gap you are experiencing.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Which product phase does this relate to?
      options:
        - Phase 1 (SDK capture)
        - Phase 2 (Compliance dashboard)
        - Phase 3 (Enterprise enforcement)
        - Phase 4 (Cross-platform governance)
        - Not sure
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to implement this
