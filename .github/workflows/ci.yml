name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'test/**', 'docs/**', 'refactor/**', 'chore/**', 'release/**']
  pull_request:
    branches: [main]

# Least privilege for every job below. CI only ever reads the repo — no job
# publishes, comments, or writes checks — so the read-only default holds for
# all of them and no job needs an override. Without this block the workflow
# inherits the repo-wide default token scopes (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    services:
      # The session-scoped _bootstrap_test_db fixture needs a real Postgres
      # even for unit tests (it runs alembic against rootsign_test before
      # collection). See feedback_phase0_discrepancies — we keep the
      # alembic-based test DB rather than Base.metadata.create_all so the
      # actions table stays a real TimescaleDB hypertable.
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: rootsign_dev
          POSTGRES_USER: rootsign
          POSTGRES_PASSWORD: rootsign
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://rootsign:rootsign@localhost:5432/rootsign_dev
      DATABASE_URL_SYNC: postgresql+psycopg2://rootsign:rootsign@localhost:5432/rootsign_dev
      TEST_DATABASE_URL: postgresql+asyncpg://rootsign:rootsign@localhost:5432/rootsign_test
      TEST_DATABASE_URL_SYNC: postgresql+psycopg2://rootsign:rootsign@localhost:5432/rootsign_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e '.[dev]'
      - name: Wait for Postgres
        run: |
          for _ in $(seq 1 30); do
            pg_isready -h localhost -U rootsign -d rootsign_dev && break
            sleep 1
          done
      - name: Bootstrap rootsign_test
        run: |
          PGPASSWORD=rootsign psql -h localhost -U rootsign -d rootsign_dev \
            -c "CREATE DATABASE rootsign_test OWNER rootsign;" || true
          PGPASSWORD=rootsign psql -h localhost -U rootsign -d rootsign_test \
            -c "CREATE EXTENSION IF NOT EXISTS timescaledb;"
      - name: Unit tests
        run: pytest tests/unit/ tests/contract/no_extras/ -v

  integration-tests:
    name: Integration tests (Python 3.12)
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: rootsign_dev
          POSTGRES_USER: rootsign
          POSTGRES_PASSWORD: rootsign
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://rootsign:rootsign@localhost:5432/rootsign_dev
      DATABASE_URL_SYNC: postgresql+psycopg2://rootsign:rootsign@localhost:5432/rootsign_dev
      TEST_DATABASE_URL: postgresql+asyncpg://rootsign:rootsign@localhost:5432/rootsign_test
      TEST_DATABASE_URL_SYNC: postgresql+psycopg2://rootsign:rootsign@localhost:5432/rootsign_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # mcp extra so the DB-backed MCP proxy integration test
      # (tests/integration/test_mcp_proxy.py) runs here instead of skipping on
      # a missing fastapi import.
      - run: pip install -e '.[dev,mcp]'
      - name: Bootstrap rootsign_test
        run: |
          PGPASSWORD=rootsign psql -h localhost -U rootsign -d rootsign_dev \
            -c "CREATE DATABASE rootsign_test OWNER rootsign;" || true
          PGPASSWORD=rootsign psql -h localhost -U rootsign -d rootsign_test \
            -c "CREATE EXTENSION IF NOT EXISTS timescaledb;"
      - name: alembic upgrade head
        run: alembic upgrade head
      - name: Integration tests
        run: pytest tests/integration/ -v

  framework-contract-langgraph:
    # ADR-003 / Sprint 2: framework contract tests are MANDATORY — this job
    # must pass on every PR before merge. Sprint 2 filled the contract suite
    # in tests/contract/langgraph/ (see ADR-004 for the interception design).
    #
    # Contract tests use a mock IngestClient and never touch the DB, so this
    # job intentionally runs WITHOUT a Postgres service. The
    # ROOTSIGN_SKIP_DB_BOOTSTRAP env var tells the session-autouse fixture
    # in tests/conftest.py to skip alembic / DB connect at session start.
    name: LangGraph contract (langgraph ~=${{ matrix.langgraph-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        langgraph-version: ['0.1', '0.2']
    env:
      ROOTSIGN_SKIP_DB_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install with langgraph extra
        run: pip install -e '.[dev,langgraph]' "langgraph~=${{ matrix.langgraph-version }}"
      - name: Contract tests
        run: pytest tests/contract/langgraph/ -v

  framework-contract-crewai:
    # ADR-005 / Sprint 3: framework contract tests for CrewAI are MANDATORY —
    # this job must pass on every PR before merge. Same pattern as the
    # langgraph job above: mock IngestClient, no DB, ROOTSIGN_SKIP_DB_BOOTSTRAP.
    #
    # Sprint 4 (S4-TASK 10): added '1.0' to lock the duck-typing strategy
    # against the 1.x line ahead of the Show HN post. Local run against
    # crewai 1.6.1 had all 13 contract tests green — the ADR-005
    # heuristic (name + _run callable) survives 1.x's BaseTool refactor
    # because we never imported the class, only the shape.
    name: CrewAI contract (crewai ~=${{ matrix.crewai-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crewai-version: ['0.28', '0.40', '1.0']
    env:
      ROOTSIGN_SKIP_DB_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install with crewai extra
        run: pip install -e '.[dev,crewai]' "crewai~=${{ matrix.crewai-version }}"
      - name: Contract tests
        run: pytest tests/contract/crewai/ -v

  framework-contract-mcp:
    # ADR-010 / Pre-Phase 2 sprint: MCP proxy contract tests are MANDATORY —
    # this job must pass on every PR before merge. Same DB-less pattern as the
    # langgraph / crewai jobs: the proxy interception + HiTL-over-MCP tests use
    # a mock IngestClient and never touch the DB, so ROOTSIGN_SKIP_DB_BOOTSTRAP
    # skips alembic / DB connect at session start.
    #
    # Installs the mcp extra (fastapi + uvicorn + mcp + httpx). Lazy imports in
    # rootsign/mcp/* mean the core SDK still imports without it (verified by a
    # test in tests/contract/mcp/), but the proxy itself needs fastapi to run.
    name: MCP proxy contract tests
    runs-on: ubuntu-latest
    env:
      ROOTSIGN_SKIP_DB_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install with mcp extra
        run: pip install -e '.[dev,mcp]'
      - name: Contract tests
        run: pytest tests/contract/mcp/ -v

  no-extras-install:
    # ADR-011 Workstream 1: the authoritative packaging-split gate. Installs
    # rootsign with NO extras and proves the core is dependency-light and
    # DB-free — no Postgres service, no database driver resolved. If a stray
    # top-level `import sqlalchemy` sneaks back into the SDK, `import rootsign`
    # here fails. This job is REQUIRED.
    name: No-extras install (DB-free core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install core only (no extras)
        run: pip install .
      - name: Zero database packages resolved
        run: |
          python - <<'PY'
          import importlib.util as u
          bad = [m for m in ("sqlalchemy","asyncpg","psycopg2","greenlet","alembic")
                 if u.find_spec(m) is not None]
          assert not bad, f"core install pulled DB packages: {bad}"
          print("no DB packages installed — OK")
          PY
      - name: import rootsign + facade surface works DB-free
        run: |
          python - <<'PY'
          import sys, rootsign
          from rootsign import (trace, session, wrap_tools, wrap_crewai_tools,
              BufferedIngestClient, IngestClient, get_ingest_client,
              verify_session_local, SessionContext, StandardPIIConfig,
              register_agent, LangGraphTracer, CrewAITracer)
          assert "sqlalchemy" not in sys.modules
          print("import rootsign OK, DB-free")
          PY
      - name: postgres backend without extra raises actionable error
        # Pin BACKEND=postgres — the default is now jsonl (ADR-011), which would
        # return a JsonlIngestClient (no error). We're testing the postgres path.
        env:
          ROOTSIGN_BACKEND: postgres
        run: |
          python - <<'PY'
          from rootsign.errors import RootSignPostgresExtraRequired
          from rootsign.sdk.client import get_ingest_client
          class _StubDB: pass
          try:
              get_ingest_client(db=_StubDB())
              raise SystemExit("expected RootSignPostgresExtraRequired")
          except RootSignPostgresExtraRequired as e:
              assert "rootsign[postgres]" in str(e), e
              print("RootSignPostgresExtraRequired raised OK")
          PY
      # NOTE: we deliberately do NOT run `pytest tests/contract/no_extras/`
      # here — the root tests/conftest.py imports sqlalchemy at module level
      # (for the DB fixtures), so pytest cannot even collect in a DB-free env.
      # The python -c checks above ARE the authoritative bare-install gate;
      # the guard-rail + subprocess isolation tests run in the unit-tests job
      # (full env, where the subprocess blocker simulates the missing stack).
